<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodDash</title>
  <!-- Tailwind CDN для навчання -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            brand: {
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
<header>
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between gap-6">

    <!-- Логотип -->
    <a href="#" class="flex items-center gap-2 text-xl font-black text-orange-500 shrink-0">
      🍔 FoodDash
    </a>

    <!-- Пошук: прихований на mobile, flex на md+ -->
    <div class="hidden md:flex items-center gap-1 bg-gray-100 rounded-full p-1 flex-1 max-w-sm">
      <span class="pl-3 text-gray-400 text-sm">🔍</span>
      <input
        type="text"
        placeholder="Знайти страву або ресторан..."
        class="bg-transparent flex-1 px-3 py-1.5 text-sm outline-none placeholder-gray-400"
      >
    </div>

    <!-- Права частина -->
    <div class="flex items-center gap-3 shrink-0">

      <!-- Адреса: тільки на md+ -->
      <button class="hidden md:block text-sm font-medium text-gray-600 hover:text-orange-500 transition-colors">
        📍 Київ
      </button>

      <!-- Кошик з лічильником -->
      <button class="relative bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-full text-sm font-bold transition-colors">
        🛒 Кошик
        <!-- Бейдж лічильника -- absolute відносно button -->
        <span class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs font-bold rounded-full size-5 flex items-center justify-center">
          3
        </span>
      </button>

      <!-- Аватар -->
      <img
        src="https://placehold.co/36x36/f97316/fff?text=OA"
        alt="Профіль"
        class="size-9 rounded-full ring-2 ring-orange-200 object-cover"
        width="36" height="36"
        loading="eager"
      >

    </div>
  </div>
</nav>
</header>
  <footer class="bg-gray-900 text-white py-12">
  <div class="max-w-7xl mx-auto px-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">

      <div>
        <div class="text-xl font-black text-orange-400 mb-3">🍔 FoodDash</div>
        <p class="text-gray-400 text-sm leading-relaxed">
          Найшвидша доставка їжі у Києві.
        </p>
      </div>

      <div>
        <h6 class="font-bold text-xs uppercase tracking-wider text-gray-500 mb-4">Компанія</h6>
        <!-- space-y-2: відступ між li без margin на кожному -->
        <ul class="space-y-2">
          <li><a href="#" class="text-gray-400 hover:text-white text-sm transition-colors">Про нас</a></li>
          <li><a href="#" class="text-gray-400 hover:text-white text-sm transition-colors">Кар'єра</a></li>
          <li><a href="#" class="text-gray-400 hover:text-white text-sm transition-colors">Блог</a></li>
        </ul>
      </div>

      <div>
        <h6 class="font-bold text-xs uppercase tracking-wider text-gray-500 mb-4">Контакти</h6>
        <ul class="space-y-2 text-sm text-gray-400">
          <li>📧 hello@fooddash.ua</li>
          <li>📱 0800 123 456</li>
        </ul>
      </div>

    </div>

    <!-- border-t: лінія-роздільник перед copyright -->
    <div class="border-t border-gray-800 pt-6
      flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-sm text-gray-500">© 2025 FoodDash. Всі права захищені.</p>
      <div class="flex gap-4 text-xs text-gray-600">
        <a href="#" class="hover:text-gray-400 transition-colors">Умови</a>
        <a href="#" class="hover:text-gray-400 transition-colors">Конфіденційність</a>
      </div>
    </div>
  </div>
</footer>
</body>
</html>
